# ─── SIPADUPAS — Nginx Reverse Proxy Config ────────────────────────
# Letakkan di /etc/nginx/conf.d/sipadupas.conf
# atau /etc/nginx/sites-available/sipadupas
#
# Untuk HTTPS, gunakan certbot:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d sipadupas.lapasbontang.go.id

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=sipadupas:10m rate=30r/s;

# Upstream Next.js app
upstream sipadupas_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sipadupas.lapasbontang.go.id;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sipadupas.lapasbontang.go.id;

    # TLS certificates (managed by certbot)
    ssl_certificate     /etc/letsencrypt/live/sipadupas.lapasbontang.go.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sipadupas.lapasbontang.go.id/privkey.pem;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Max upload size (untuk barang titipan, dokumen, dll)
    client_max_body_size 10M;

    # Proxy to Next.js
    location / {
        limit_req zone=sipadupas burst=50 nodelay;

        proxy_pass http://sipadupas_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static assets: cache aggresif
    location /_next/static/ {
        proxy_pass http://sipadupas_backend;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Public assets
    location /logo.svg {
        proxy_pass http://sipadupas_backend;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Block sensitive paths
    location ~ /\. {
        deny all;
    }
    location ~* /(prisma|node_modules|\.env|\.git) {
        deny all;
    }
}
